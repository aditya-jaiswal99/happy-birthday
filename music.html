<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Music</title>
</head>

<body>

    <audio id="bgMusic" src="music/love.mp3" loop></audio>

    <script>
        const music = document.getElementById("bgMusic");

        window.addEventListener("message", function(event) {

            if (event.data === "play") {
                music.play();
            }

            if (event.data === "pause") {
                music.pause();
            }

        });
    </script>

</body>

</html>
